name: trail-release

# Builds the rex-trail binary for every platform trail supports and attaches them to the GitHub
# release for the trail-v* tag.
#
# Asset names are a contract with plugins/trail/scripts/install.sh, do not change them:
#   rex-trail-<os>-<arch>   os in {linux, macos}, arch in {x86_64, aarch64}
#   SHA256SUMS              "<sha256>  <asset name>" per binary

on:
  push:
    tags: ["trail-v*"]

permissions:
  contents: read

concurrency:
  group: trail-release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: plugins/trail

jobs:
  # The installer fetches trail-v<Cargo.toml version>, so a tag that disagrees with it would
  # publish binaries nobody can install.
  versions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Tag matches Cargo.toml
        run: |
          tag="${GITHUB_REF_NAME#trail-v}"
          cargo="$(sed -n -E 's/^version[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' Cargo.toml | head -n 1)"
          printf '%-12s %s\n' tag "$tag" Cargo.toml "$cargo"
          if [ "$cargo" != "$tag" ]; then
            echo "version mismatch: the tag must equal the Cargo.toml version" >&2
            exit 1
          fi

  build:
    needs: versions
    name: build ${{ matrix.asset }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-latest
            asset: rex-trail-macos-aarch64
            native: true
          # Cross-compiled on Apple silicon; checked only for existence.
          - target: x86_64-apple-darwin
            runner: macos-latest
            asset: rex-trail-macos-x86_64
            native: false
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
            asset: rex-trail-linux-x86_64
            native: true
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
            asset: rex-trail-linux-aarch64
            native: true
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install musl tools
        if: contains(matrix.target, 'linux-musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build
        env:
          TARGET: ${{ matrix.target }}
        run: cargo build --release --locked --target "$TARGET"
      - name: Stage asset
        env:
          TARGET: ${{ matrix.target }}
          ASSET: ${{ matrix.asset }}
        run: |
          mkdir -p dist
          cp "target/$TARGET/release/rex-trail" "dist/$ASSET"
          ls -l dist
      - name: Smoke test
        env:
          ASSET: ${{ matrix.asset }}
          NATIVE: ${{ matrix.native }}
        run: |
          test -f "dist/$ASSET"
          if [ "$NATIVE" = true ]; then
            version="$(sed -n -E 's/^version[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' Cargo.toml | head -n 1)"
            reported="$("./dist/$ASSET" --version)"
            echo "$reported"
            test "$reported" = "rex-trail $version"
          fi
      - name: Check static linkage
        if: contains(matrix.target, 'linux-musl')
        env:
          ASSET: ${{ matrix.asset }}
        run: |
          file "dist/$ASSET"
          file "dist/$ASSET" | grep -Eq 'statically linked|static-pie linked'
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: plugins/trail/dist/${{ matrix.asset }}
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          path: plugins/trail/dist
          merge-multiple: true
      - name: Checksums
        working-directory: plugins/trail/dist
        run: |
          expected="rex-trail-linux-x86_64 rex-trail-linux-aarch64 rex-trail-macos-x86_64 rex-trail-macos-aarch64"
          for name in $expected; do
            test -f "$name" || { echo "missing $name"; exit 1; }
          done
          sha256sum $expected > SHA256SUMS
          cat SHA256SUMS
      - name: Release notes
        run: |
          version="${GITHUB_REF_NAME#trail-v}"
          awk -v v="$version" '/^## \[/{p = ($0 ~ "^## \\[" v "\\]")} p' CHANGELOG.md > notes.md
          test -s notes.md || { echo "CHANGELOG.md has no section for $version" >&2; exit 1; }
          cat notes.md
      # Draft first, upload everything, then publish, so nobody downloads a
      # half-filled release. A published release's assets are never replaced;
      # a draft left by a failed run is refilled.
      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version="${GITHUB_REF_NAME#trail-v}"
          if draft=$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft 2>/dev/null); then
            if [ "$draft" != true ]; then
              echo "release $GITHUB_REF_NAME is already published; refusing to replace its assets" >&2
              exit 1
            fi
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --draft --title "trail $version" --notes-file notes.md
          fi
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          gh release edit "$GITHUB_REF_NAME" --draft=false
